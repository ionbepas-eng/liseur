name: Liburuville APK

# Builds the Liburuville APK (foss flavor) on every push to main and on
# demand, signs it with the fork's own key, and publishes it as the
# "latest" release so it can be downloaded straight from the phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liburuville
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LIBURU_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIBURU_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::Falta el secreto LIBURU_KEYSTORE_B64"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/liburuville.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/liburuville.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=liburuville
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build
        run: ./gradlew assembleFossRelease --console=plain

      - name: Collect APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/foss/release -name '*arm64-v8a*.apk' | head -1)
          [ -n "$apk" ] || apk=$(find app/build/outputs/apk/foss/release -name '*.apk' | head -1)
          cp "$apk" Liburuville.apk
          ls -la Liburuville.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Liburuville
          path: Liburuville.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Liburuville.apk \
            --title "Liburuville (última versión)" \
            --notes "Compilado desde ${GITHUB_SHA::7}. Descarga Liburuville.apk desde el móvil o la tablet para instalar o actualizar." \
            --latest
